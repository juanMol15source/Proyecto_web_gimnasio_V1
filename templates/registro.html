{% extends "base.html" %}

{% block contenido %}
<h2>Crear una cuenta</h2>

<form method="POST">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" maxlength="60" placeholder="Tu nombre" autocomplete="name" required>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" maxlength="120" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
    <small>Mínimo 8 caracteres.</small>

    <button type="submit">Registrarme</button>
</form>
{% endblock %}
